<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Document Portal</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <div class="logo-badge">D</div>
            <h2>Create Account</h2>
        </div>

        <div id="alertBox" class="alert-msg"></div>

        <form id="signupForm">
            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" class="form-control" placeholder="Alex Morgan" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="alex@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
            </div>
            <div class="form-group">
                <label for="role">Account Role</label>
                <select id="role" class="form-control">
                    <option value="user" selected>Applicant</option>
                    <option value="reviewer">Reviewer</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>
            <button type="submit" class="btn-submit">Register Account</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Sign In</a>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            alertBox.style.display = 'none';

            const payload = {
                full_name: document.getElementById('fullName').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.message || 'Registration failed.');

                setAuthSession(data.token, data.user);
                alertBox.className = 'alert-msg alert-success';
                alertBox.innerText = 'Account created! Redirecting...';
                alertBox.style.display = 'block';
                setTimeout(() => window.location.href = 'index.html', 800);
            } catch (err) {
                alertBox.className = 'alert-msg alert-danger';
                alertBox.innerText = err.message;
                alertBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
